<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .btn-custom {
            width: 180px;
            padding: 12px;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary {
            background: #ffffff;
            color: #667eea;
            border: none;
        }

        .btn-primary:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .btn-success {
            background: #ffffff;
            color: #28a745;
            border: none;
        }

        .btn-success:hover {
            background: #28a745;
            color: white;
            transform: scale(1.05);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 30px;
        }

        .subtitle {
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 40px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h2><i class="bi bi-people-fill"></i> User Management</h2>
        <div class="subtitle">
            Create and Search User Records Instantly
        </div>

        <div class="d-flex justify-content-center gap-3">
            <a href="/create" class="btn btn-primary btn-custom">
                <i class="bi bi-person-plus-fill"></i> Create User
            </a>

            <a href="/search" class="btn btn-success btn-custom">
                <i class="bi bi-search"></i> Search User
            </a>
        </div>
    </div>

</body>
</html>
