<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h3 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 12px;
            border: none;
            padding-left: 40px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px #ffffff50;
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: white;
            position: absolute;
            z-index: 10;
            margin-left: 10px;
            margin-top: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease-in-out;
        }

        .btn-submit {
            background: #ffffff;
            color: #667eea;
            border: none;
        }

        .btn-submit:hover {
            background: #667eea;
            color: white;
            transform: scale(1.03);
        }

        .btn-back {
            background: transparent;
            border: 1px solid white;
            color: white;
        }

        .btn-back:hover {
            background: white;
            color: #764ba2;
        }

        label {
            margin-bottom: 6px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h3><i class="bi bi-person-plus-fill"></i> Create User</h3>

        <form method="post">

            <div class="mb-3 input-wrapper">
                <label>Username</label>
                <i class="bi bi-person-fill input-group-text"></i>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3 input-wrapper">
                <label>Phone</label>
                <i class="bi bi-telephone-fill input-group-text"></i>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <div class="mb-4 input-wrapper">
                <label>City</label>
                <i class="bi bi-geo-alt-fill input-group-text"></i>
                <input type="text" name="city" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-submit btn-custom mb-3">
                <i class="bi bi-check-circle-fill"></i> Submit
            </button>

            <a href="/" class="btn btn-back btn-custom">
                <i class="bi bi-arrow-left"></i> Back
            </a>

        </form>
    </div>

</body>
</html>
